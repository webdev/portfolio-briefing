# Curated ticker → GICS-style sector map — single source of truth for the
# Sector Exposure (look-through) panel and diversification-aware conviction
# (analysis/sector_exposure.py). 2026-08-07, George: "It seems like I'm
# pretty heavily invested in tech. Is it the right thing?"
#
# Rules (mirror CLAUDE.md #19 — no fabricated data):
#   - Only names whose sector classification is reliably known are listed.
#     Anything NOT here falls back to the FMP profile sector (if FMP_API_KEY
#     is present, cached 24h) and otherwise buckets as "Unclassified" —
#     the code NEVER guesses.
#   - `tech_correlated: true` flags names OUTSIDE Info Tech / Comm Services
#     that trade with the tech complex (TSLA, SOFI, AMZN, VRT, ...). Info
#     Tech + Comm Services count as tech-correlated automatically. Keep the
#     flag list tight — flagging a name commits the tech-% math to it.
#   - `etf_lookthrough` decomposes ETFs into sector weights. Broad-index
#     weights are APPROXIMATE (rendered with '~', flagged `approx: true`) —
#     look-through estimates, not exact holdings.

