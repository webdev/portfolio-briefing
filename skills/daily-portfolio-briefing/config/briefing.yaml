# Briefing Configuration Template
# Copy to state/briefing_config.yaml and customize

# Account scope. The briefing pipeline analyzes ONLY accounts whose
# accountDesc matches one of these entries (case-insensitive, exact match).
# The user has multiple E*TRADE accounts (Joint, Individual Brokerage,
# INDIVIDUAL, IRAs) but currently only INDIVIDUAL is in scope — see CLAUDE.md.
# To widen later, add more entries (e.g. ["INDIVIDUAL", "ROTH IRA"]).
account_desc_whitelist:
  - INDIVIDUAL

# LLM second-opinion review of the finished briefing (task #51). Runs AFTER
# all deterministic rules — the rules stay the source of truth for
# actionables; the LLM adds cross-section pattern-matching + contradiction
# spotting. Requires ANTHROPIC_API_KEY in .env. Fail-open: any API error
# is silently caught, briefing still ships.
fable_review:
  enabled: true                        # off by default; opt-in per user
  model: claude-opus-4-6               # Opus 4.6 for real reasoning.
                                       # Override to claude-sonnet-4-6
                                       # or claude-haiku-4-5-20251001 to
                                       # cut cost. See fable_review.py
                                       # for cost estimates.
  max_tokens: 1200                     # keeps reviews under ~350 words
  timeout_sec: 60                      # opus is slower than haiku
  max_input_chars: 120000              # cap input; larger briefings truncated

# ── Fable Advisor v2 (task #54) — persona + memory ──────────────────────
# When enabled, this OVERRIDES fable_review (v1) as the LLM second-opinion
# pass. v2 is a private-wealth-advisor persona rather than a locked-down
# critic. Key difference from v1: v2 reads state/fable_advisor_memory.md
# for continuity — it knows what it flagged yesterday, remembers your
# standing directives ("deferring SPY hedge until VIX > 22"), and names
# patterns in your behavior over time.
#
# Fallback behavior: if v2 errors OR is disabled, aggregate.py falls
# through to v1 (fable_review) — never silently omits the review section.
#
# Memory file: state/fable_advisor_memory.md (auto-created on first run,
# in .gitignore, hand-editable — put standing directives in the Notes
# section at the top).
#
# Cost: ~35K input (briefing ~25K + memory ~10K) + ~800 output ≈ $0.60/run
# at Opus. Marginal delta vs v1's ~$0.43. See fable_advisor.py header.
fable_advisor:
  enabled: true                        # takes precedence over fable_review
  model: claude-opus-4-6               # reasoning matters more than speed
  max_tokens: 1500                     # advisor voice runs longer than critic
  timeout_sec: 90                      # larger context = slower response
  max_input_chars: 200000              # includes briefing + memory
  keep_reviews: 14                     # rolling window of past reviews in memory

# Brokerage backend for live pulls + chain data. "etrade" (default) or "schwab".
# Set to "schwab" only on a Schwab-backed instance. When "schwab", also set
# schwab_account_labels so account_desc_whitelist can match (Schwab exposes
# only CASH/MARGIN as the account 'type', not a nickname).
brokerage: etrade
# schwab_account_labels:
#   "123456789": INDIVIDUAL

# Task #36 — snapshot chain/quote routing (hard rule #2: tradeable chain
# prices from E*TRADE only). source: etrade routes the snapshot's option
# chains AND quotes through the canonical etrade-chain-fetcher / E*TRADE
# batch-quote API with a ≤4 req/s aggregate throttle. HELD underlyings +
# near-expiries fetch first; candidate chains fill the remaining budget up
# to etrade_max_chains — beyond the cap (or on any E*TRADE failure / token
# absence) chains fall back to yfinance, LABELED per-chain, and provenance
# reports the honest split ("chains: 112 etrade · 38 yfinance-fallback").
# Live runs (--etrade-live) route regardless of this flag.
chains:
  source: etrade
  etrade_max_chains: 150

enabled_strategies:
  - wheel              # covered calls + cash-secured puts
  - dividend_growth    # pullback entry on dividend growers (optional)
  - swing              # short-term mean-reversion (optional)

# Screeners: which ones to run and how often
screeners:
  value_dividend_screener:
    enabled: true
    frequency: every_run    # or: weekly, monthly
  earnings_trade_analyzer:
    enabled: false
    frequency: weekly
  pead_screener:
    enabled: false
    frequency: weekly
  pair_trade_screener:
    enabled: false
    frequency: monthly
  # Broad-universe wheel-setup screener (Step 8.7): FMP company-screener
  # scan (one /stable/ API call) → exclusion of Parkev + Scout names →
  # yfinance deep-dive → discipline gates (RSI 35-50, IV rank ≥ 60, at
  # support, no earnings ≤ 21d, optionable, cap > $2B). Writes
  # daily_screener_<DATE>.md. Requires FMP_API_KEY (same key as intrinsic
  # value — no FINVIZ Elite subscription); fail-open (never blocks the
  # briefing). ENABLED 2026-07-03 per user request; FMP swap same day (task #8).
  broad_universe:
    enabled: true
    frequency: every_run
    # Output cache (task #9): reuse a same-day, same-config screener result
    # younger than cache_ttl_hours instead of re-running the FMP scan +
    # yfinance deep-dive (the single most expensive step of the pipeline).
    # The capacity banner and fair-value notes are re-computed fresh on every
    # run either way. Date change / config change / corruption / TTL expiry
    # all invalidate; any cache problem falls back to the full run.
    cache_enabled: true
    cache_ttl_hours: 6

# Persistent OHLC cache (task #9) — daily bars cached to disk in front of
# every yfinance history() pull (snapshot technicals ~200 tickers × 730d,
# scout ~133 × 300d, broad-screener deep-dive). Warm runs fetch only the
# missing recent bars (~1 small request per ticker); adjusted-close drift
# (new dividend/split) or >max_stale_days staleness triggers a full refetch.
# Fail-open everywhere: corrupt/missing cache → raw yfinance call, never a
# blocked briefing. Store: parquet when pyarrow/fastparquet is installed,
# CSV otherwise. Disable with enabled: false to get the exact pre-cache path.
ohlc_cache:
  enabled: true
  dir: state/cache/ohlc
  max_stale_days: 30

# Benchmark tracking + P/L attribution (task #16). Daily "am I beating
# SPY?" table + bucketed attribution (realized/unrealized equity, option
# premium, assignments, hedges, cash drag) rendered after Risk Alerts and
# written to the briefing JSON as `benchmark_report` (webapp 📊 Benchmark
# tab). NLV history comes from prior state/briefing_snapshots/<DATE>/
# balance.json; benchmark closes come through the OHLC cache. Fail-open:
# any error omits the panel, never blocks the briefing. Windows whose
# start predates the earliest snapshot render "n/a" (never fabricated).
benchmark_tracking:
  enabled: true                # ON by default — this is core to the strategy
  benchmark_ticker: SPY        # tunable to VOO, VTI, QQQ etc.
  min_snapshots_for_report: 5  # skip if too little history
  # 2026-08-04 NLV correction: history through 2026-08-03 stored accountValue
  # WITHOUT short-option marks. scripts/recompute_nlv_history.py writes
  # accountValue_corrected alongside the original; a rebase date below fires
  # ONLY for any uncorrectable prefix (belt and suspenders — no-op when the
  # migration covered the full history).
  nlv_rebase_dates: ["2026-08-04"]
  # windows:                   # optional override of the default windows
  #   - {name: "30d", days: 30}
  #   - {name: "90d", days: 90}
  #   - {name: "6m", days: 182}
  #   - {name: "YTD", days: null, mode: "ytd"}
  #   - {name: "1y", days: 365}
  #   - {name: "inception", days: null, mode: "inception"}

# Thematic scout execution (task #9). parallel: false falls back to a
# sequential loop with identical per-ticker logic — use it if yfinance
# starts rate-limiting concurrent fetches.
thematic_scout:
  parallel: true
  max_workers: 8

# Deep technical analysis — the "🎯 Technical Read" section (per-ticker
# BB(20,2) / MACD(12,26,9) / ATR(14) / SMA slopes / golden-death cross /
# 52w range / ATH drawdown / returns + short-term (1-4wk) and long-term
# (3-12mo) verdicts) plus the "📋 Per-Ticker Actions" entry/exit recommender
# (EXIT_URGENT / TRIM / ENTRY_STRONG / ENTRY_WATCH / AVOID; HOLD is silent).
# Indicators come from the same 730d yfinance OHLC pull that feeds RSI/S-R —
# no extra fetch. Fail-closed: a ticker whose OHLC fetch failed renders
# "chart data unavailable, verify manually" — never fabricated indicators.
# The recommender respects capacity gates (ENTRY under a closed gate demotes
# to ENTRY_WATCH), core_positions (EXIT → TRIM override), standing directives
# in state/fable_advisor_memory.md (TRIM suppressed), and flags Parkev
# top-pick conflicts without suppressing the call.
technical_analysis:
  enabled: true
  recommender:
    enabled: true
    # Band overrides (see analysis/entry_exit_recommender.py DEFAULT_PARAMS):
    # entry_rsi_max: 40
    # trim_rsi_min: 70
    # trim_bb_min: 85
    # support_near_pct: 3.0

# Risk parameters
risk:
  max_position_pct: 0.10          # Max 10% NLV in any single name
  max_sector_pct: 0.35            # Max 35% NLV in any sector
  max_portfolio_risk_pct: 0.15    # Max 15% NLV at risk (stop loss) at any time
  leverage_cap: 1.0               # 1.0 = no margin, 1.5 = 50% leverage

# Core positions: long-term holdings with significant unrealized gains.
# The briefing treats these specially:
#   1. Prefer DIAGONAL UP rolls (raise cap) over CALENDAR rolls (extend at same cap),
#      since assignment would trigger a large taxable event.
#   2. Trigger DEFENSIVE COLLAR proposals when concentration > 10% AND embedded tax > 2% NLV.
#   3. Show estimated tax cost on every action that would lead to assignment.
core_positions:
  - GOOG
  - GOOGL
  - NVDA
  - MSFT
  - VRT
  - ADBE
  - AMZN
  - META
  # Add TSLA here too if you want to treat it as core. Without it, a
  # third-party SELL rec on TSLA will still surface EXIT as Tier 1.

# Concentration caps. Two-tier system:
#   concentration_cap_pct       — non-core trim trigger (default 10%)
#   core_concentration_cap_pct  — soft cap for core holdings: only "roll
#                                 covered calls up" is suggested, never sell
#   core_runaway_cap_pct        — hard cap on core holdings: at this point
#                                 the system flags "REVIEW CORE" with full
#                                 option menu (CC roll / partial sale / collar)
concentration_cap_pct: 10
core_concentration_cap_pct: 18
core_runaway_cap_pct: 22

# 2026-08-04 fix 4 — hedge-nag resolution: after this many consecutive
# IGNORED sessions, the HEDGE action vacates the numbered action list
# (it stops outranking money actions). It remains in ⛔ Stalled Items and
# the 💰 Money Plan as a standing question, with ready-to-paste directive
# templates (defer-until-coverage / hedge-now-at-half-size).
hedge_nag_days: 14

# Long-term-opportunity-advisor target weights:
#   default_target_weight_pct — non-core (5%). LT TRIM triggers at 1.5× = 7.5%
#   core_target_weight_pct    — core (12%). LT TRIM triggers at 1.5× = 18%
#                                Prevents mega-cap conviction holdings from
#                                being flagged as overweight at normal sizes.
default_target_weight_pct: 5
core_target_weight_pct: 12

# Tax assumptions for the LTCG-cost estimates above.
# Effective LTCG rate = federal LTCG (20%) + NIIT (3.8%) for high-income.
# Adjust to match user's actual marginal rate. Use 0.15 for moderate income.
ltcg_rate: 0.238
stcg_rate: 0.408                  # 37% federal + 3.8% NIIT

# Account routing
accounts:
  - accountIdKey: "E123456"      # E*TRADE taxable account
    type: TAXABLE
    weight_pct: 45               # 45% of portfolio
    enabled: true

  - accountIdKey: "R789012"      # E*TRADE Roth IRA
    type: ROTH_IRA
    weight_pct: 30               # 30% of portfolio
    enabled: true
    liquidity_minimum_pct: 0.60  # Keep 60% liquid (cash)

  - accountIdKey: "T345678"      # E*TRADE Traditional IRA
    type: TRADITIONAL_IRA
    weight_pct: 25               # 25% of portfolio
    enabled: false
    liquidity_minimum_pct: 0.60

# Wheel strategy parameters
wheel:
  short_put_delta_range: [0.15, 0.30]    # Target 15-30 delta puts
  short_call_delta_range: [0.20, 0.35]   # Target 20-35 delta calls
  min_dte_for_roll: 21                   # Don't roll within 21 days
  loss_trigger_multiple_monthly: 1.40    # Close at 1.40× premium paid
  loss_trigger_multiple_weekly: 1.50     # Close at 1.50× premium paid

# Roll selection (action list). The action list defers to the position's own
# wheel-roll-advisor: it never surfaces EXECUTE ROLL when the advisor recommends
# HOLD. When a roll IS warranted, the ranker prefers roll-UP (higher strike,
# preserves upside) and rejects candidates that extend the expiration beyond the
# tenor cap below — so we never recommend capping a name for years just to
# harvest long-dated time-value premium. Core names may extend 3× longer.
roll:
  max_action_tenor_days: 120             # reject action-list rolls longer than this (non-core)
  # Task #40 fix 2 (2026-07-30): churn guard — no roll recommendation on a
  # contract opened within this many TRADING days (VRT $280P filled 2:23 PM,
  # re-roll recommended 2:54 PM). Loss-stop/crash guardrails are exempt —
  # safety always wins. Age measured from prior snapshots' position lists;
  # unmeasurable age never fires the guard (fail-open).
  min_position_age_days: 5
  # Task #40 fix 5: debit-to-collateral sanity cap — a proposed roll debit
  # above this fraction of the NEW leg's collateral demotes the roll to a
  # Watch note (IREN: $652 debit on $3,700 collateral = 18%); the exit-cost
  # verdict proposes the alternative (close / take assignment).
  max_debit_pct_of_collateral: 0.08

# Task #43 defect 3 (2026-07-31, AMD $420P): standing hold directives whose
# release conditions predate an earnings print are PAUSED (not deleted) when
# earnings are within this many days AND capture ≥ 25% — the CLOSE surfaces
# with a "directive paused" note so the user decides before the binary.
# Directives containing the phrase "through earnings" are exempt.
directives:
  earnings_release_days: 7

# Task #40 fix 4 (2026-07-30, LITE $700P): when a roll is earnings-blocked
# AND the position has recovered to better than max_loss_pct of premium AND
# earnings are ≤ 14d away → surface CLOSE INTO RECOVERY (exit flat, remove
# the binary, re-enter post-print). Outranks the ROLL_DONT_CLOSE exit-cost
# verdict — that verdict optimizes premium mechanics, not event risk.
recovery_close:
  max_loss_pct: 0.05          # "recovered" = loss ≤ 5% of premium received

# Strike-tested discipline (task #38, 2026-07-30 — the MU $950P Jul-22 miss:
# a put being TESTED at low profit fell to DEFAULT_HOLD; a week later the
# roll cost $4,700). The wheel-roll-advisor's GUARDRAIL_STRIKE_TESTED covers
# DTE ≥ 21 (see wheel-roll-advisor/references/wheel_parameters.yaml →
# strike_tested); below that, the action list forces the decision. Every key
# has an in-code default.
strike_tested:
  forced_decision_dte: 21     # tested short puts at/below this DTE get a ⛔ mandatory decision item

# Credit-window indicator (task #38) — classify each held short put's
# same-or-lower-strike roll economics (open / closing / debit_only / unknown)
# from the advisor's priced candidates; render in the Watch panel and alert
# on open→closing / open→debit_only transitions vs the previous briefing.
credit_window:
  closing_threshold_per_share: 0.50   # credit/share at/above → window OPEN
  max_tenor_days: 365                 # ignore candidates extending beyond this

# Exit-cost anatomy (2026-07-29 LITE $700P lesson) — before surfacing a
# buy-to-close on an ITM/underwater short put, decompose the buyback into
# intrinsic / extrinsic / spread from the live chain and say whether closing,
# rolling, or assignment is the cheaper exit. Closing at IV highs pays away
# panic premium; a roll-down-and-out is IV-neutral. Fail-closed: no chain
# quote this cycle → "verify at broker", never a fabricated number. Verdicts
# never override the loss-stop guardrail (no bare HOLD when it fired).
# See scripts/analysis/exit_cost.py. Every key has an in-code default.
exit_cost:
  enabled: true
  # Task #37 fix 1: the verdict DRIVES the action list — CLOSE_CLEAN /
  # CLOSE_AFTER_CRUSH / CLOSE_URGENT convert a composed EXECUTE ROLL into a
  # plain CLOSE ticket (rule #14: defer to the position's own advisor).
  # Set false to restore annotate-only behavior.
  verdict_drives_action: true
  # 2026-08-04 fix 1: ONE-VOICE rule — a card carries exactly ONE
  # recommendation. A profitable take-profit CLOSE whose verdict is
  # ROLL_DONT_CLOSE resolves to TAKE PROFIT VIA ROLL-DOWN (two-leg ticket)
  # or, when no credit-positive roll-down is priced, HOLD — GTC at the
  # 50%-capture price — never a CLOSE headline contradicted by an inline
  # "ROLL, don't close" verdict (the VRT $280P card). Kill switch.
  one_voice: true
  extrinsic_clean_pct: 0.15     # extrinsic < 15% of mid → CLOSE_CLEAN (cheap exit)
  extrinsic_pumped_pct: 0.30    # extrinsic > 30% of mid → ROLL_DONT_CLOSE candidate
  iv_elevated_rank: 60          # IV rank at/above this counts as "elevated"
  wide_spread_pct: 0.08         # spread > 8% of mid → work a GTC limit at mid
  wide_spread_abs: 2.00         # spread > $2.00/share → work a GTC limit at mid
  min_dte_for_roll: 21          # roll-don't-close needs at least this much runway

# Close-winner dollar action floor (rule #43 micro-fix, 2026-08-04 — the
# observed "CLOSE AMZN_CALL_330_20260904 — +30% ($+27)" card: a
# recommendation to bank twenty-seven dollars; commissions/spread eat a
# meaningful fraction and it occupies an action slot). A take-profit CLOSE
# whose banked profit is below this floor demotes to a Watch-panel note
# ("let it decay or close at your convenience"). Exceptions that ALWAYS
# surface regardless of the floor: pre-print closes (earnings ≤ 2d),
# loss-stops, CLOSE_URGENT/recovery verdicts, gamma-week (DTE ≤ 10) closes
# on short puts. Set 0 to disable the floor.
close_winner_min_dollars: 100

# Covered-call strike selection — DELTA-FIRST (volatility-adaptive). The same
# delta sits further OTM on a high-IV name (more headroom) and closer on a
# low-IV name; a flat %OTM target caps volatile names too tight (the SOFI
# $17-on-$16 case). Falls back to fallback_otm_pct ONLY when the chain carries
# no usable deltas — and then the briefing renders "δ n/a", never a fabricated
# delta. See scripts/steps/strategy_upgrades.py::_etrade_call_quote.
covered_call:
  target_delta: 0.25            # aim for a ~0.25-delta call (wheel 0.20-0.30 band)
  delta_tolerance: 0.12         # accept the nearest strike within ±0.12 delta
  fallback_otm_pct: 6.0         # used only when the chain has no deltas

# Portfolio capacity gates — HARD blocks on new short-put entries
# (06-wheel-parameters.md §7A, added 2026-06-11). Portfolio-level gates close
# ALL new CSP entries (coverage floor / cash floor / total-obligation ceiling);
# per-name and per-expiry caps block individual candidates. The gate banner is
# printed in the briefing header and at the top of the candidates and
# when-to-enter reports. See scripts/analysis/capacity_gates.py. Every key has
# an in-code default, so deleting this block does not break the pipeline.
capacity_gates:
  min_stress_coverage_for_new_puts: 0.50   # block all new puts below 0.50x coverage
  min_cash_pct_for_new_puts: 0.05          # block all new puts below 5% NLV cash
  max_short_puts_per_name: 1               # one short put per underlying
  second_put_exception_max_collateral_pct: 0.06   # 2nd OK if combined ≤ 6% NLV...
  second_put_exception_min_expiry_gap_days: 60    # ...AND expirations ≥ 60d apart
  max_collateral_per_name_pct: 0.06        # total per-name put collateral ≤ 6% NLV
  max_obligation_per_expiry_pct: 0.25      # single expiration's obligation ≤ 25% NLV
  max_total_put_obligation_pct: 0.80       # whole-book put obligation ≤ 80% NLV

# RSI discipline — RSI(14) is shown on EVERY recommendation and hard-gates new
# opens. Bands are read asymmetrically (overbought is bad for selling puts but
# good for selling covered calls). The gate suppresses only NEW opens; existing
# positions (rolls/closes/trims/collars) are annotated, never blocked. These are
# the "standard wheel bands." See scripts/analysis/rsi_discipline.py.
rsi_discipline:
  enabled: true
  put:                          # selling cash-secured puts
    block_above: 70             # overbought → suppress new put-sales
    caution_above: 60           # extended → warn / size down
    favored_high: 50            # pullback sweet spot upper edge
    favored_low: 30             # pullback sweet spot lower edge
    falling_knife_below: 25     # momentum break → warn (dip may not hold)
  call:                         # selling covered calls
    favored_above: 60           # extended → rich premium, favored to write
    caution_below: 60           # mid-range → warn (caps upside cheaply)
    block_below: 35             # oversold → suppress new covered calls
  # RSI 60-70 on a NEW put-sale (LT_CSP / PULLBACK CSP / income opportunity /
  # candidate CSP) demotes it to a "⏸ CSPs — wait for a pullback" subsection —
  # full ticket shown (rule #24), never a numbered actionable rec. Set to null
  # to disable (the >70 hard block above is unchanged). Rule #43, 2026-07-31.
  put_extended_wait_band: [60, 70]

# Post-gap IV-rank honesty (rule #43, AMZN 2026-07-31): the IV rank is a
# 252-day REALIZED-vol percentile — a recent earnings gap inflates it while
# implied premium crushes post-print. When a rec's rationale claims "fat
# premium" at rank ≥ min_rank but the DELIVERED annualized yield (from the
# actual quoted premium) is below min_yield_for_fat_claim, the claim is
# rewritten honestly (gap-aware) + the reconsider note fires. Fail-open on
# missing data. See scripts/analysis/iv_honesty.py.
iv_gap_check:
  min_rank: 60                  # only cross-check "fat" claims at/above this rank
  min_yield_for_fat_claim: 0.20 # delivered annualized yield below 20% = thin
  gap_threshold_pct: 8          # |1d/2d move| ≥ 8% within last 3 sessions = gap

# Task #43 — TRUE chain-implied vol (replaces the realized-vol "IV rank"
# proxy on every surface where chains were fetched this cycle). Per
# underlying: ATM 30d implied vol (interpolated from the strikes bracketing
# spot), 25Δ put-call skew (skew blowout when > skew_sigma_threshold σ of its
# own trailing mean), and term slope (front − back ATM IV; positive =
# inverted / front-stressed). True IVrank = percentile of today's atm_iv_30d
# vs the rolling per-ticker history (252 entries) persisted to history_path;
# while history < min_history_days the rank renders "building history" and
# the legacy realized-vol percentile stays as a LABELED companion (RVrank) —
# never as "IV rank". See scripts/analysis/chain_iv.py.
chain_iv:
  enabled: true
  history_path: state/chain_iv_history.json  # relative to the skill root
  min_history_days: 20          # rank renders n/a below this many observations
  skew_sigma_threshold: 2.0     # skew blowout flag at ≥ 2σ vs trailing mean

# Intrinsic value — attach a fair-value read (FMP DCF + analyst price-target
# consensus) to EVERY single-stock recommendation. ETFs are labelled
# "n/a — basket"; missing FMP data fails closed (no fabricated number). Requires
# the FMP_API_KEY environment variable; without it the briefing surfaces a single
# transparency footer. See scripts/analysis/intrinsic_value.py.
intrinsic_value:
  enabled: true
  ttl_hours: 24                 # cache fair values for a day (FMP free-tier friendly)
  etf_tickers: []               # extra ETFs to treat as baskets (merged with defaults)

# Same-cycle vintage guard — never mix pre-gap technicals with live quotes on
# one card. When a name's live quote has moved more than max_intraday_move_pct
# from the close its technicals were computed at (yfinance previous close),
# stale "RSI favourable" promotions are stripped (RSI tagged pre-gap, never
# recomputed/fabricated) and 200-SMA distances are recomputed at live spot.
vintage_guard:
  enabled: true
  max_intraday_move_pct: 0.05   # 5% intraday move vs technicals' close

# Rule #43 (GOOG 2026-08-03) — LTO reference demotion. A fully-gated LTO/CSP
# card (equity-stacking ⛔ hard-skip, stale qualifying RSI per the vintage
# guard, or ≥2 independent hard gates) loses its numbered "Trade:" slot and
# moves to the unnumbered "📎 Shown for reference — not actionable today"
# subsection at the END of the LTO section (full ticket preserved, rule #24).
# Capacity gate alone NEVER demotes — deferred-for-capacity cards keep their
# numbered planning value (rules #24 / #41).
lto_reference_demotion:
  enabled: true
  stale_rsi_demotes: true
  hard_skip_demotes: true

# Position tier framework (CLAUDE.md hard rule #29) — controls how
# aggressively the system writes covered calls and manages concentration
# on each name.
#
#   Tier A — LT Core compounders: NO CC recommendations ever; cap raised
#            to ~22% (concentration in conviction IS the strategy).
#   Tier B — Income holdings: conservative CC only (deep OTM, low delta,
#            50% coverage cap, ≤ 30 DTE); cap ~12%.
#   Tier C — Active wheel (default): current discipline (RSI ≥ 60,
#            ~0.25 delta, ~6% OTM, 100% coverage, ≤ 45 DTE); cap ~8-10%.
#
# Tickers not listed below default to Tier C — so an empty / missing
# `position_tiers` block reproduces the legacy pre-framework behavior.
position_tiers:
  tier_a_core:
    - NVDA
    - GOOG
    - MSFT
    - META
    - PLTR
    - AMZN
    - VOO          # user is consolidating SPY → VOO; leave both for now
    - SPY

  tier_b_income:
    - MU
    - SMH

  # tier_c_active is implicit (default) — list it explicitly only if you
  # want to pin a ticker against accidental promotion to A/B via reorg.

# Per-tier covered-call discipline. Keys per tier:
#   enabled                       — false = NO CC recs of any kind
#   rsi_floor                     — only write when RSI ≥ this number
#   min_otm_pct                   — strike must sit at least this far OTM
#   max_delta                     — selected strike's delta ≤ this number
#   coverage_cap_pct              — max % of held shares to back with CC
#                                   contracts (e.g. 50 = at most 50% of the
#                                   round-lot count). 0 = no contracts at
#                                   all. 100 = current behavior (cover all).
#   max_dte                       — reject expirations beyond this DTE
#   roll_up_trigger               — spot/strike ratio that flags a roll-up
#   tax_aware_assignment_block    — when True, block roll-ups that would
#                                   reset the holding period inside the
#                                   60-day window before LTCG threshold
covered_call_tiers:
  tier_a:
    # STRICT mode (the original Tier A gate): fires only when the name is
    # genuinely overbought (RSI ≥ 75). Prevents capping rebounds.
    # ENABLED 2026-07-07 per user request (task #19) — combined with the
    # per-name opt-in below, only NVDA and MSFT are eligible under this
    # punitive envelope; META/GOOG/SPY/AMZN remain untouched.
    enabled: true
    rsi_floor: 75
    min_otm_pct: 20.0
    max_delta: 0.10
    coverage_cap_pct: 20        # write against at most 20% of round-lots
    max_dte: 30
    roll_up_trigger: 0.92
    tax_aware_assignment_block: true

    # Per-name opt-in list — REQUIRED for a specific Tier A name to be
    # eligible under either strict or engineered mode below.
    # 2026-07-07: NVDA + MSFT — user's rally names where he's willing to
    # write when they're genuinely stretched (rule #34).
    willing_to_write_cc_on: [NVDA, MSFT]

    # ENGINEERED mode (task #47): the "smart middle ground" that fires
    # even when RSI < 75, provided the strike is REBOUND-PROOF — above
    # both the 200-SMA target AND the analyst PT so a snapback doesn't
    # cap the position. Fires only when:
    #   - RSI ≥ engineered.rsi_floor (default 40 = not oversold)
    #   - Drawdown ≥ engineered.min_drawdown_pct (rebound premium present)
    #   - IV rank ≥ engineered.min_iv_rank (rich premium)
    #   - Strike ≥ max(200-SMA, analyst PT, spot × (1 + min_otm_pct))
    #   - Delta ≤ engineered.max_delta (low assignment prob)
    #   - DTE ≤ engineered.max_dte (short-gamma window)
    #   - Coverage ≤ engineered.coverage_cap_pct (leaves majority uncovered)
    # Rationale: "smart CC on a Tier A compounder in drawdown — collect
    # rich premium at zero rebound-cap risk."
    engineered:
      # ENABLED 2026-07-07 per user request (task #19) — the "smart middle
      # ground" that catches Tier A compounders in real drawdown with rich
      # IV. Only fires on names in willing_to_write_cc_on (currently NVDA,
      # MSFT) — so META/GOOG/SPY are still hard-blocked.
      enabled: true
      rsi_floor: 40             # not falling-knife
      min_drawdown_pct: 10.0    # rebound room exists
      min_iv_rank: 70           # premium worth the trade
      min_otm_pct: 13.0         # minimum, actual strike is max() of this + rebound-proof
      max_delta: 0.15           # ~10-15% assignment prob = real premium
      max_dte: 21               # short-gamma window
      coverage_cap_pct: 20      # 80% of position keeps full upside
      require_rebound_proof: true          # strike MUST sit ≥ 200-SMA (21-day rebound target)
      # Ultra-conservative extra: require strike ALSO above analyst PT.
      # In practice this pushes strikes to 30-45% OTM and collapses
      # premium to pennies. Off by default; the 200-SMA gate + short DTE
      # already give a rebound-proof strike with real premium.
      min_strike_above_analyst_pt: false
  tier_b:
    enabled: true
    rsi_floor: 70
    min_otm_pct: 10.0
    max_delta: 0.15
    coverage_cap_pct: 50
    max_dte: 30
    roll_up_trigger: 0.93
    tax_aware_assignment_block: true
  tier_c:
    enabled: true
    rsi_floor: 60
    min_otm_pct: 4.0
    max_delta: 0.30
    coverage_cap_pct: 100
    max_dte: 45
    roll_up_trigger: 0.97
    tax_aware_assignment_block: false

# Per-tier concentration caps (% of NLV). Concentration drift only alerts
# when the position exceeds the tier-specific cap, so a tier-A name at
# 18% NLV is "within bounds" rather than a warning.
concentration_caps:
  tier_a_max_pct: 22.0
  tier_b_max_pct: 12.0
  tier_c_max_pct: 8.0
  default_max_pct: 10.0

# Task #22 — Actionable Rotation Playbook: close all freeable winner CSPs
# (>=30% capture, not directive-held) and redeploy the freed collateral into
# conviction-ranked deferred CSP candidates. Rendered after CSP Rotations.
rotation_playbook:
  enabled: true
  min_freed_collateral_usd: 30000     # skip playbook if less than this available
  max_opens: 8                        # cap the number of new entries
  deploy_target_pct: 0.90             # aim to deploy 90% of freed, keep 10% cushion
  # Task #27: floor lowered 6 -> 4 so a fresh tier-2 borderline BUY + Medium
  # (2x2x1 = 4) qualifies; no-rec names (score <= 3) stay below the floor.
  min_conviction_score: 4             # skip candidates below this score
  diversify_max_same_ticker: 1        # max entries per underlying (default 1)
  # Rule #39 playbook exception: a FRESH (<=14d) Parkev BUY with High
  # conviction may override the LT-verdict gate — admitted with the -3
  # score penalty and a visible warning, never silently. Set false to
  # disable the exception entirely (strict rule #39).
  lt_override_fresh_high_conviction: true
  # Task #27 widening of the exception: fresh Parkev BUY-variant with
  # (High + tier>=3) OR (Medium + tier>=3 + drawdown>=30%) overrides —
  # still with the -3 penalty and the visible warning. Set false to revert
  # to the strict High-only exception (kill switch).
  lt_override_medium_conviction: true
  # Task #27: pre-trade validator WARN findings (e.g. STRIKE_NOT_AT_SUPPORT)
  # annotate the candidate as warnings instead of affecting selection.
  # BLOCK findings still hard-exclude regardless of this flag.
  treat_warn_as_annotation: true
  # Rule #43 (RDDT 2026-07-31): a single-stock candidate with NO measured
  # earnings date takes this conviction penalty + a loud "⚠ earnings
  # unverified" flag (demotion, never exclusion — data absence is not
  # evidence of earnings, but IV 90 on a drawdown name is often exactly
  # pre-earnings premium). ETFs exempt.
  earnings_unknown_penalty: 2
  # Rule #43 (AMZN 2026-08-03): Phase 2 final gate battery — yield floors.
  # A candidate delivering less than 12% annualized OR premium below 0.5% of
  # collateral is excluded ("premium doesn't pay for the risk"); the same
  # battery vintage-checks the snapshot RSI against the live quote (>5% move
  # → stale; upward + unverifiable live RSI → fail-safe exclude) and applies
  # the standard RSI hook (>70 hard block, 60-70 extended-wait), and rewrites
  # gap-inflated IV-rank claims (revoking the +1 conviction bonus).
  playbook_min_annualized_yield: 0.12
  playbook_min_premium_pct_of_collateral: 0.005
  # allow_stacking_with_held: false   # re-admit same-name (non-overlap) stacks
  # Task #28: coverage-adaptive deployment cap. The playbook's deploy ceiling
  # is a function of PROJECTED post-Phase-1 stress coverage — at crisis
  # coverage the correct behavior is closes-heavy, opens-light (save the
  # freed cash to actually improve coverage, don't cycle it right back into
  # new obligation). When adaptive_deploy_bands is set, it overrides the flat
  # deploy_target_pct and acts as a HARD deployment ceiling.
  # Set adaptive_deploy_bands: null (or remove) to fall back to flat behavior.
  adaptive_deploy_bands:
    - {below: 0.20, cap_pct: 0.30, label: "crisis coverage — prioritize cushion"}
    - {below: 0.50, cap_pct: 0.50, label: "defensive coverage — half cushion"}
    - {below: null, cap_pct: 0.90, label: "healthy coverage — normal deployment"}
  # Task #29: bucket diversification (soft) — prefer spreading Phase 2 opens
  # across expiration Fridays; warn hard when one Friday dominates anyway.
  bucket_diversification:
    max_bucket_pct_of_deploy: 0.60  # warn if a single Friday holds >60% of deployed
    tie_break_prefer_diverse: true  # among tied-score candidates, prefer a new bucket
    hard_cap_pct: null              # optional HARD cap vs deploy budget (e.g. 0.80); null disables
  # Task #30: equity-stacking penalty — a new short put on a name whose
  # EQUITY the user already holds concentrates single-name risk. Bands are
  # fractions of NLV held in the underlying's equity; >= hard_skip_pct is a
  # HARD SKIP (surfaced in the warnings footer, never silent).
  # force_include: [NVDA]  # per-ticker kill switch: downgrades hard-skip to -3
  equity_stacking:
    modest_band_pct: [0.02, 0.05]     # -1 + "modest equity concentration" tag
    concerning_band_pct: [0.05, 0.10] # -3 + "stacks equity concentration" tag
    hard_skip_pct: 0.10               # >=10% NLV held -> hard skip
    modest_penalty: 1
    concerning_penalty: 3
  # Task #31: support-quality gate — proximity alone isn't an anchor. A strike
  # at/below a >=2-touch support cluster is clean (below-support is
  # protective); anchored only to a 1-touch level (e.g. bare 52w-low) or
  # floating >5% from any cluster takes -2. Missing S/R -> no penalty.
  support_quality:
    min_touches_for_strong: 2
    at_support_band_pct: 0.05      # ±5% of strike counts as "at" a cluster
    below_support_band_pct: 0.15   # strike up to 15% BELOW a cluster = protected
    single_touch_penalty: 2
    floats_penalty: 2
  # Task #32: smooth freshness decay for the Parkev-rec multiplier (replaces
  # the old 3-band step: <=14d 2.0 / <=30d 1.0 / else 0.5). age_days null
  # (no rec) -> the multiplier is not applied at all (tier x conviction only).
  freshness_bands:
    - {max_days: 7, multiplier: 2.5}     # very fresh — analyst just spoke up
    - {max_days: 14, multiplier: 2.0}    # fresh — still current
    - {max_days: 21, multiplier: 1.5}    # recent — moderate weight
    - {max_days: 30, multiplier: 1.0}    # month-old — baseline
    - {max_days: 60, multiplier: 0.5}    # fading — decayed weight
    - {max_days: null, multiplier: 0.25} # stale — near-zero credit

# Task #42 — Put credit spreads, reference-first pilot. Defined-risk income
# for Tier C premium-only names: the spread variant of each ALREADY-GATED
# CSP candidate (same short strike; long leg ≈ width_target below, from the
# same snapshot chain) consumes ~(width − credit) of buying power instead of
# full cash-secured collateral. mode: reference (default) renders the
# side-by-side paper-watch card + tracks outcomes in
# state/spread_paper_ledger.json and changes NO gates; mode: live renders
# actionable two-leg tickets (built, off by default). Tier A/B names are
# excluded — conviction names keep the assignment path. Skips (zero-bid long
# leg, credit% below floor, no chain) always render with reasons (rule #24).
spread:
  enabled: true
  mode: reference                # reference (paper-watch) | live
  width_target: 20               # $ width; high-priced names use 10% of strike
  high_price_width_pct: 0.10
  min_credit_pct_of_width: 0.15  # quality floor — skip thinner spreads

# Task #45 — Claude/Autopilot portfolio as a SECOND rec source (anonymous,
# low weight). Fetched fail-open by skills/claude-portfolio-fetcher (live
# page fetch → manual seed fallback, 24h cache, provenance-labeled). CP-held
# tickers get a `🤖 CP-held` chip after the Parkev chip; the rotation
# playbook adds agreement_bonus ONLY when BOTH Parkev (BUY-variant) AND the
# Claude portfolio agree — CP membership alone never qualifies a candidate.
claude_portfolio:
  enabled: true
  agreement_bonus: 1

# Output
output:
  output_dir: "reports/daily"
  snapshot_dir: "state/briefing_snapshots"
  preserve_days: 90                       # Keep snapshots for 90 days
