# Wheel strategy parameters for decision matrix

loss_stops:
  loss_stop_monthly: 2.0        # 2.0x entry premium for DTE > 10
  loss_stop_weekly: 1.5         # 1.5x entry premium for DTE <= 10
  weekly_put_dte_threshold: 10

defensive_roll:
  min_dte_for_roll: 21
  defensive_roll_profit_min: 0.50

take_profit:
  deep_otm_take_profit_pct: 0.80
  moderate_otm_take_profit_pct: 0.50
  near_atm_take_profit_pct: 0.40
  itm_take_profit_pct: 0.30

# Smart take-profit guardrails (task #49) — three-layer optimization
# for "more gains without crazy risk". Fires as CLOSE_FOR_PROFIT before
# the matrix cells if any layer triggers.
smart_take_profit:
  # HARD CEILING — always close at N% capture regardless of DTE.
  # Beyond this, remaining premium isn't worth the gamma risk.
  hard_ceiling_pct: 0.85

  # GAMMA ESCAPE — lock the win before the last-week gamma-risk zone.
  gamma_escape_dte: 10
  gamma_escape_min_profit: 0.30

  # TIME-ADJUSTED — reward fast wins. Close when captured ≥
  # time_adjusted_multiplier × (days_elapsed / initial_dte) × 100.
  time_adjusted_multiplier: 2.0
  time_adjusted_min_days_elapsed: 3
  time_adjusted_min_profit: 0.30

# Strike-tested trigger (task #38) — fire AT the strike, not through it.
# Pre-matrix guardrail on SHORT PUTs: the at-the-money moment is when
# extrinsic peaks and credit rolls are biggest (the MU $950P Jul-22 miss).
strike_tested:
  enabled: true
  delta_trigger: 0.45          # |delta| at/above → strike is being tested
  price_band_pct: 0.03         # fallback (no delta): spot within 3% of strike, either side
  min_dte: 21                  # below 21 DTE the briefing's forced-decision item owns it
  max_profit_to_fire: 0.30     # at >=30% capture, take-profit logic owns the decision
  deep_itm_pct: 0.10           # >10% ITM belongs to the ITM matrix cells
  forced_decision_dte: 21      # briefing: tested puts at <=21 DTE get a mandatory decision item

# Credit-window indicator (task #38) — classify same-or-lower-strike roll
# economics from the priced candidates. open / closing / debit_only / unknown.
credit_window:
  closing_threshold_per_share: 0.50   # credit/share at/above → window OPEN
  max_tenor_days: 365                 # ignore candidates extending beyond this

roll_targets:
  delta_target_normal_iv: 0.22   # Normal IV rank (30-60)
  delta_target_high_iv: 0.16     # High IV rank (>60)
  delta_max_normal_iv: 0.30
  delta_max_high_iv: 0.22
  min_oi_for_roll: 100
  max_spread_pct_for_roll: 0.05
  min_net_credit_pct: 0.10
  min_net_credit_abs: 0.25
  max_stress_loss_multiple: 3.0

liquidity_gates:
  min_bid_ask_spread_pct: 0.01
  min_volume: 5

earnings_guards:
  earnings_guard_dte_max: 30
  earnings_guard_window_days: 7
  earnings_guard_profit_pct: 0.50

iv_thresholds:
  low_iv_threshold: 30
  high_iv_threshold: 60
  extreme_iv_threshold: 80

dte_bands:
  expiry_week_max: 7
  short_dte_max: 21
  mid_dte_max: 120
  long_dte_min: 121

moneyness_delta:
  deep_otm_max_delta: 0.10
  moderate_otm_max_delta: 0.25
  near_atm_max_delta: 0.50
