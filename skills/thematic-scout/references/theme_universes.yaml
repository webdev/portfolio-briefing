# Thematic universes for the thematic-scout skill.
#
# Each theme has:
#   name      — human label rendered in the report
#   group     — optional parent grouping (e.g. "AI Buildout") for the renderer
#   anchors   — tickers to analyze (curated list of leaders + emerging names)
#   etfs      — relevant ETFs (rendered as benchmarks in the report)
#   notes     — one-line thematic context
#
# Order in this file is the order in the report. The first five themes
# below are the "AI Buildout" pillars (Semis → Memory → Photonics → Data
# Centers → Power). Quantum and Cybersecurity follow as adjacent themes.

themes:
  semis:
    name: "Semis"
    group: "The AI Buildout"
    anchors:
      - NVDA   # AI compute leader
      - AMD    # GPU + datacenter
      - INTC   # foundry comeback + foundational CPU
      - ASML   # EUV lithography monopoly
      - TSM    # foundry monopoly
      - ARM    # IP licensing for AI inference
      - AVGO   # AI ASIC + networking
      - MRVL   # custom ASIC
      - QCOM   # mobile + automotive + edge
      - TXN    # analog / power management
      - SMCI   # AI server builder
      - DELL   # AI server builder (PowerEdge XE9680 / Blackwell rack-scale) — added 2026-06-01
      # === Parkev-sheet AI-fits added 2026-06-01 (semi-equipment + EDA "picks-and-shovels") ===
      - CDNS   # Cadence Design — EDA monopoly for AI chip design
      - SNPS   # Synopsys — EDA monopoly (chip design tools + IP)
      - KLAC   # KLA — semi process metrology
      - LRCX   # Lam Research — etch / deposition equipment
      - AMAT   # Applied Materials — fab equipment leader
      - "ON"   # OnSemiconductor — power semis + automotive AI (quoted: bare ON parses as YAML boolean True)
      - ONTO   # Onto Innovation — semi metrology / inspection
      # === Theme ETFs promoted to anchors 2026-06-01 (user actively trades these) ===
      - SMH    # VanEck Semiconductor ETF — user holds short calls + shares
      - SOXX   # iShares Semiconductor ETF — user holds short calls + shares
    etfs: [SMH, SOXX, QQQ, CHPX]   # CHPX = Global X AI Semiconductor & Quantum ETF (verified 2026-05-22)
    notes: "Hyperscaler capex cycle, Claude / GPT compute demand"

  memory_storage:
    name: "Memory & Storage"
    group: "The AI Buildout"
    anchors:
      - SNDK   # SanDisk parent (re-spin)
      - MU     # micron — HBM + DRAM
      - STX    # seagate — HDD
      - WDC    # western digital — NAND + HDD
      - PSTG   # Pure Storage — enterprise flash arrays for AI workloads — added 2026-06-01
      - DRAM   # Roundhill Memory ETF — promoted to anchor 2026-06-01 for direct tracking
    etfs: [DRAM]   # DRAM = Roundhill Memory ETF (SK hynix, Samsung, MU, SNDK, Kioxia); verified 2026-05-22
    notes: "HBM ramp for AI, NAND price recovery, hyperscale storage"

  photonics_optics:
    name: "Photonics & Optics"
    group: "The AI Buildout"
    anchors:
      - NOK    # nokia — optical networking infra
      - LITE   # lumentum — optical modules
      - COHR   # coherent — optical components
      - AAOI   # applied optoelectronics
      - GLW    # corning — fiber + glass
      - CIEN   # ciena — optical networking
      - FN     # fabrinet — contract manufacturing for optics
    etfs: []   # no dedicated photonics/optics ETF; optics names (LITE, COHR, CIEN, GLW) sit inside broad semis ETFs (SMH/SOXX)
    notes: "AI cluster interconnect demand (CPO, co-packaged optics)"

  ai_data_centers:
    name: "AI Data Centers"
    group: "The AI Buildout"
    anchors:
      - NBIS   # nebius — Yandex-spinoff AI cloud
      - IREN   # iris energy — miner → AI hosting
      - CRWV   # coreweave — AI hyperscaler
      - CIFR   # cipher mining — miner / AI infra
      - WULF   # terawulf — miner / AI hosting
    etfs: [WGMI]   # WGMI = CoinShares Bitcoin Mining ETF (IREN, CIFR, WULF, CORZ); verified 2026-05-22
    notes: "Bitcoin miners pivoting to AI infrastructure / GPU hosting"

  power:
    name: "Power"
    group: "The AI Buildout"
    anchors:
      - CEG    # constellation — pure-play nuclear baseload
      - BE     # bloom energy — solid oxide fuel cells
      - VRT    # vertiv — datacenter cooling/power
      - NVTS   # navitas — GaN/SiC power semis
      - OKLO   # small modular reactor (SMR)
      - UUUU   # energy fuels — uranium miner
      - GEV    # GE Vernova — grid + turbines
      - LEU    # centrus energy — uranium enrichment
      - EOSE   # eos energy — zinc-based grid storage
      - SMR    # NuScale — SMR
      - ETN    # eaton — power management
      # === Parkev-sheet AI-fits added 2026-06-01 (alt energy + storage) ===
      - CCJ    # Cameco — uranium miner (nuclear fuel cycle)
      - ENPH   # Enphase Energy — solar microinverters
      - PLUG   # Plug Power — hydrogen fuel cells (Hold-rated; alt energy)
      - QS     # QuantumScape — solid-state batteries / grid storage
    etfs: [URA, NLR, XLU, POWR, GRID]   # URA/NLR=nuclear; POWR=iShares US Power Infra, GRID=First Trust Smart Grid; verified 2026-05-22
    notes: "Datacenter power demand → nuclear renaissance, grid buildout"

  applications:
    name: "Applications"
    group: "The AI Buildout"
    anchors:
      - PLTR   # palantir — AIP + enterprise/defense AI ops
      - NOW    # servicenow — AI workflows + agentic automation
      - PANW   # palo alto — security platform (also in cybersecurity)
      - CRWD   # crowdstrike — endpoint (also in cybersecurity)
      - TSM    # foundry — AI chips
      - ARM    # IP licensing for AI inference
      - AVGO   # AI ASIC + networking
      - MRVL   # custom ASIC
      - QCOM   # mobile + automotive + edge AI
      - TXN    # analog / power management
      - CRM    # Salesforce — enterprise CRM + Einstein AI agents — added 2026-06-01
      - INTU   # Intuit — TurboTax/QuickBooks SaaS, GenAI integration — added 2026-06-01
      - SNOW   # Snowflake — data warehouse / AI workload platform — added 2026-06-01
      # === Parkev-sheet AI-fits added 2026-06-01 (SaaS + AI software layer) ===
      - ORCL   # Oracle — AI cloud + database, OCI growth story
      - DDOG   # DataDog — observability for AI workloads
      - MDB    # MongoDB — NoSQL data platform
      - TEAM   # Atlassian — devops / collaboration SaaS
      - WDAY   # Workday — HR SaaS + AI agents
      - MNDY   # monday.com — work-management SaaS
      - AI     # C3.ai — enterprise AI applications
      - APP    # AppLovin — mobile ad-tech AI
      - TWLO   # Twilio — communications APIs + AI agents
      - ZM     # Zoom — video + AI Companion assistant
      - DOCU   # DocuSign — e-signature + AI agreement intelligence
      - IGV    # iShares Expanded Tech-Software ETF (proxy)
      - XLK    # Tech Select Sector SPDR — promoted to anchor 2026-06-01 for broad-tech read
      - QQQ    # Nasdaq-100 ETF — promoted to anchor 2026-06-01 for broad-mega-cap-tech tape
    etfs: [IGV, XLK]
    notes: "Software + chips running AI workloads at the application layer"

  networking:
    name: "Networking"
    group: "The AI Buildout"
    anchors:
      - ANET   # arista — cloud / AI cluster networking leader
      - CSCO   # cisco — enterprise networking + Splunk
    etfs: []   # no dedicated networking ETF; ANET/CSCO are top holdings of broad tech ETFs (XLK, QQQ)
    notes: "Switching/routing for AI training and inference clusters"

  # Ancillary themes that ride on the AI Buildout wave

  ancillary_space:
    name: "Space"
    group: "Ancillary"
    anchors:
      - SPCX   # SpaceX — launch + Starlink. Nasdaq IPO Jun 12 '26 ($135 offer); verified 2026-06-12.
               # Day-1 listing: RSI(14)/200-SMA/IV-rank/drawdown need price history — scout
               # fail-closed rules render n/a until the window fills. Options may lag the IPO.
      - ASTS   # AST SpaceMobile — direct-to-cell satellites
      - FLY    # Firefly Aerospace
      - RKLB   # Rocket Lab — launch + Neutron
      - PL     # Planet Labs — earth imagery + AI insights
      - LUNR   # Intuitive Machines — lunar lander
      - BKSY   # BlackSky — earth observation
    etfs: [UFO, ARKX]
    notes: "Satellite buildout + earth observation feeding AI models. SPCX added at IPO 2026-06-12."

  ancillary_robotics:
    name: "Robotics & Autonomy"
    group: "Ancillary"
    anchors:
      # ── Platforms (physical + software) ──
      - TSLA   # tesla — Optimus + FSD as robotics platform
      - PATH   # UiPath — RPA / software robots
      - AMZN   # amazon — warehouse robotics
      - UBER   # mobility / autonomy via Waymo partnerships — added 2026-06-01
      # ── Perception & sensing (added 2026-07-02) ──
      # The "eyes" of AI-in-the-physical-world — ADAS, machine vision, lidar.
      # Rationale: the platforms above are useless without perception; theme
      # widened to cover the sensor stack alongside the actuator stack.
      - MBLY   # Mobileye — ADAS + computer vision market leader (Intel-majority)
      - CGNX   # Cognex — industrial machine vision (the "eyes" of factory robots)
      - APTV   # Aptiv — ADAS software + AV/EV tier-1 supplier
      - OUST   # Ouster — lidar (post-Velodyne consolidation)
      - LAZR   # Luminar — automotive lidar (Volvo/Mercedes) — speculative, small cap
      - AEVA   # Aeva — FMCW lidar (differentiated tech) — speculative, micro cap
    etfs: [BOTZ, ROBO]
    notes: "Physical + software robotics AND the perception layer (vision + lidar) that powers them. NVDA (Isaac/GR00T/Drive AV) is tracked under semis but is arguably the largest robotics-enablement platform in the market — theme momentum reads may undercount NVDA's contribution."

  ancillary_drones:
    name: "Drones"
    group: "Ancillary"
    anchors:
      - KTOS   # kratos defense
      - ONDS   # ondas — small/medium drones
      - LMT    # lockheed martin — defense primes
      - AVAV   # AeroVironment — switchblade etc.
      - UMAC   # unusual machines
    etfs: [PPA, ITA]
    notes: "Defense + commercial drones; high-IV / event-driven names"

  ancillary_rare_earths:
    name: "Rare Earths"
    group: "Ancillary"
    anchors:
      - USAR   # USA Rare Earth
      - MP     # MP Materials — rare-earth miner
      - FCX    # Freeport-McMoRan — copper / molybdenum
      - AA     # Alcoa — aluminum
    etfs: [REMX]
    notes: "Critical minerals for chips, magnets, batteries"

  # Adjacent themes (not part of AI Buildout but worth tracking)

  quantum:
    name: "Quantum Computing"
    group: "Adjacent"
    anchors:
      - IONQ   # trapped-ion
      - RGTI   # rigetti — superconducting
      - QBTS   # d-wave — annealing
      - IBM    # superconducting (one of many bets)
      - HON    # honeywell — Quantinuum stake
      - QTUM   # Defiance Quantum ETF — promoted to anchor 2026-06-01 for sector benchmark
    etfs: [QTUM, CHPX]   # QTUM=Defiance Quantum; CHPX=Global X AI Semiconductor & Quantum; verified 2026-05-22
    notes: "Early stage; high vol, mostly thematic"

  cybersecurity:
    name: "Cybersecurity"
    group: "Adjacent"
    anchors:
      - CRWD   # crowdstrike — endpoint
      - PANW   # palo alto — platform
      - ZS     # zscaler — SASE
      - S      # sentinelone — endpoint challenger
      - NET    # cloudflare — edge + zero trust
      - OKTA   # identity
      - FTNT   # fortinet — firewalls + SASE
      - CYBR   # cyberark — privileged access
      - RBRK   # Rubrik — data security / backup / cyber resilience — added 2026-06-01
      # === Theme ETFs promoted to anchors 2026-06-01 (so they get full When-To-Enter cards) ===
      - HACK   # ETFMG Prime Cyber Security ETF — sector benchmark
      - CIBR   # First Trust NASDAQ Cybersecurity ETF — sector benchmark
    etfs: [HACK, CIBR]
    notes: "Cloud-native security shift, SASE/zero trust"

  social_ad_tech_ai:
    name: "Social & Ad-Tech AI"
    group: "Adjacent"
    anchors:
      - META   # Meta Platforms — Llama, AI ad targeting; Parkev "Top Stock to Buy" (tier 5) — added 2026-06-01
      - RDDT   # Reddit — AI training-data licensing (OpenAI/Google deals) + ad platform — added 2026-06-01
      - PINS   # Pinterest — visual-AI shopping + ad targeting — added 2026-06-01
      - SNAP   # Snap — AR + My AI chatbot + ad platform — added 2026-06-01
      - TTD    # The Trade Desk — programmatic ad-tech AI (Koa AI) — added 2026-06-01
      - SOCL   # Global X Social Media ETF — sector benchmark, promoted to anchor 2026-06-01
      - XLC    # Communication Services Select Sector SPDR — promoted to anchor 2026-06-01
    etfs: [SOCL, XLC]   # SOCL=Global X Social Media; XLC=Communication Services Select Sector
    notes: "Social platforms riding the AI wave via training-data licensing + LLM-powered ad targeting"

  # ── Diversification themes (added 2026-08-07) ─────────────────────────
  # Non-tech sectors so the daily candidate machine sources diversification —
  # the book is ~90% tech-correlated and every candidate was tech before
  # these. Anchors are liquid, optionable large caps where CSP/wheel
  # mechanics work (tight spreads, real IV). Capped at ≤7 anchors per theme
  # to bound daily scout runtime/API cost.

  healthcare_pharma:
    name: "Healthcare & Pharma"
    group: "Diversification"
    anchors:
      - UNH    # UnitedHealth — managed care leader
      - LLY    # Eli Lilly — GLP-1 / obesity franchise
      - JNJ    # Johnson & Johnson — diversified pharma + medtech
      - ABBV   # AbbVie — immunology (Skyrizi/Rinvoq post-Humira)
      - MRK    # Merck — Keytruda oncology franchise
      - PFE    # Pfizer — diversified pharma, high yield
      - TMO    # Thermo Fisher — life-science tools (picks-and-shovels)
      # NOTE: single-binary biotechs deliberately excluded (tail-risk rule —
      # FDA headlines gap 15-25% through any strike; wheel mechanics break)
    etfs: [XLV]   # XLV = Health Care Select Sector SPDR; verified 2026-08-07
    notes: "Defensive diversifier — demographics + GLP-1 cycle; low tech correlation"

  energy:
    name: "Energy"
    group: "Diversification"
    anchors:
      - XOM    # ExxonMobil — integrated major, Guyana + Permian
      - CVX    # Chevron — integrated major, high yield
      - COP    # ConocoPhillips — largest pure E&P
      - SLB    # Schlumberger — oilfield services leader
      - OXY    # Occidental — Permian + Berkshire-backed; high IV
      - EOG    # EOG Resources — low-cost shale E&P
    etfs: [XLE, OIH]   # XLE = Energy Select Sector SPDR; OIH = VanEck Oil Services; verified 2026-08-07
    notes: "Commodity-driven diversifier — oil cycle largely uncorrelated to tech tape"

  financials:
    name: "Financials"
    group: "Diversification"
    anchors:
      - JPM    # JPMorgan — money-center leader
      - GS     # Goldman Sachs — capital markets / IB
      - MS     # Morgan Stanley — wealth management + IB
      - BAC    # Bank of America — rate-sensitive money center
      - SCHW   # Charles Schwab — brokerage / asset gathering
      - V      # Visa — payments network (toll booth)
      - MA     # Mastercard — payments network (toll booth)
    etfs: [XLF]   # XLF = Financial Select Sector SPDR; verified 2026-08-07
    notes: "Rate-cycle + capital-markets diversifier; deep option liquidity across the group"

  defense_aerospace:
    name: "Defense & Aerospace"
    group: "Diversification"
    anchors:
      - LMT    # Lockheed Martin — largest prime (also in Drones theme)
      - RTX    # RTX — missiles/defense + commercial aero engines
      - NOC    # Northrop Grumman — B-21 + space systems
      - GD     # General Dynamics — submarines + Gulfstream
      - BA     # Boeing — commercial aero duopoly + defense
      - GE     # GE Aerospace — engines + aftermarket services
    etfs: [ITA, PPA]   # ITA = iShares US Aerospace & Defense; PPA = Invesco Aerospace & Defense; verified 2026-08-07
    notes: "Budget-cycle driven, geopolitics-hedged diversifier; long-cycle backlogs"

  consumer_staples_value:
    name: "Consumer Staples & Value"
    group: "Diversification"
    anchors:
      - PG     # Procter & Gamble — staples bellwether
      - KO     # Coca-Cola — global beverages, dividend aristocrat
      - PEP    # PepsiCo — beverages + snacks
      - COST   # Costco — membership retail compounder
      - WMT    # Walmart — scale retail + ads/membership flywheel
      - MCD    # McDonald's — franchised royalty model
      - DIS    # Disney — entertainment/streaming value turnaround (closest theme fit)
    etfs: [XLP]   # XLP = Consumer Staples Select Sector SPDR; verified 2026-08-07
    notes: "Defensive cash-flow diversifier — low beta vs the AI complex, steady wheel premium"

# Verdict thresholds — same logic as long-term-opportunity-advisor but tuned
# for outbound research (slightly more permissive on WATCH).
verdict:
  rsi_oversold: 35
  rsi_overheated: 75
  drawdown_oversold_pct: 10
  drawdown_thesis_broken_pct: 30
  sma_within_pct: 5
  csp_target_otm_pct: 10
  csp_target_dte: 35
  iv_rank_elevated: 50
